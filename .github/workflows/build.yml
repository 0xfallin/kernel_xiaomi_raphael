name: Build RikkaKernel for Redmi K20 Pro

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup environment
        run: |
          sudo apt update
          sudo apt install git wget curl build-essential bc bison flex libssl-dev libncurses5-dev zip clang llvm lld -y

      - name: Download Proton Clang
        run: |
          mkdir clang
          cd clang
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git .
          cd ..

      - name: Build Kernel
        run: |
          export PATH="$(pwd)/clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export KBUILD_BUILD_USER=HeliumStudio
          export KBUILD_BUILD_HOST=Rikka
          make O=out ARCH=arm64 raphael_defconfig
          make -j$(nproc) O=out ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-

      - name: Upload Kernel Build
        uses: actions/upload-artifact@v4
        with:
          name: RikkaKernel
          path: out/arch/arm64/boot/Image.gz-dtb
